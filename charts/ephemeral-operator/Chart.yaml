apiVersion: v2
name: ephemeral-operator
description: Kubernetes operator for ephemeral environments (EphemeralEnv and EnvironmentTemplate CRDs).
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - kubernetes
  - operator
  - ephemeral
  - environments
maintainers:
  - name: kubeEphemerals
    url: https://github.com/xRizur/kubeEphemerals
dependencies:
  # Official chart: helm repo add oauth2-proxy https://oauth2-proxy.github.io/manifests
  - name: oauth2-proxy
    version: "10.1.2"
    repository: https://oauth2-proxy.github.io/manifests
    condition: auth.enabled
