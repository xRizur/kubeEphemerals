{{- if .Values.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: ephemeral-auth
  namespace: {{ include "ephemeral-operator.namespace" . }}
  labels:
    {{- include "ephemeral-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  # htpasswd file: one line per user (user:bcrypt_hash). Default: admin / password
  # Generate new: htpasswd -nbB user password
  auth: |
    {{- .Values.auth.htpasswd | default "admin:$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy" | nindent 4 }}
{{- end }}
