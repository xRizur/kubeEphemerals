# CI Pipeline: Lint, Unit Tests (JUnit + PR comment), E2E on Kind
name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main, '**']

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2
          # Annotations appear on the PR File diff and in the Actions summary
          output.format: sarif
          output.path: golangci-lint.sarif
          args: --timeout=5m

      - name: Upload SARIF (annotations in PR)
        if: always() && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: golangci-lint.sarif
          category: golangci-lint
        continue-on-error: true

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up envtest (etcd, kube-apiserver)
        run: |
          mkdir -p bin
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23
          ENVTEST_PATH=$(PATH=$(go env GOPATH)/bin:$PATH setup-envtest use 1.35 --bin-dir bin -p path)
          echo "KUBEBUILDER_ASSETS=$PWD/$ENVTEST_PATH" >> $GITHUB_ENV

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run tests
        run: gotestsum --junitfile junit.xml -- ./... -coverprofile=coverage.out
        env:
          GOFLAGS: -mod=mod

      - name: Publish Unit Test Results (PR comment)
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit.xml
          check_name: Unit Test Results
          comment_title: Unit Test Results
          comment_mode: always
          fail_on: test failures
          report_individual_runs: false

  e2e:
    name: E2E (Kind + Helm)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ephemeral-operator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load image into Kind
        run: |
          kind load docker-image ephemeral-operator:ci --name e2e

      - name: Install Helm chart
        run: |
          helm upgrade --install ephemeral-operator ./charts/ephemeral-operator \
            --namespace ephemeral-operator-system \
            --create-namespace \
            --set image.repository=ephemeral-operator \
            --set image.tag=ci \
            --set image.pullPolicy=IfNotPresent

      - name: Verify operator Pod
        run: |
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=ephemeral-operator \
            -n ephemeral-operator-system --timeout=120s

      - name: Verify CRDs
        run: |
          kubectl get crd ephemeralenvs.ephemeral.ephemeralenv.io -o name
          kubectl get crd environmenttemplates.ephemeral.ephemeralenv.io -o name
