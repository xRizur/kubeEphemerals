# CI Pipeline: Lint, Unit Tests (JUnit + PR comment), E2E on Kind
name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main, '**']

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: "Lint & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2
          args: --timeout=5m

  unit-tests:
    name: "Unit Tests & Coverage"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up envtest (etcd, kube-apiserver)
        run: |
          mkdir -p bin
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23
          ENVTEST_PATH=$(PATH=$(go env GOPATH)/bin:$PATH setup-envtest use 1.35 --bin-dir bin -p path)
          echo "KUBEBUILDER_ASSETS=$PWD/$ENVTEST_PATH" >> $GITHUB_ENV

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run tests
        run: gotestsum --junitfile junit.xml -- -coverprofile=coverage.out $$(go list ./... | grep -v /e2e)
        env:
          GOFLAGS: -mod=mod

      - name: Publish Unit Test Results (PR comment)
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit.xml
          check_name: Unit Test Results
          comment_title: Unit Test Results
          comment_mode: always
          fail_on: test failures
          report_individual_runs: false

  e2e:
    name: "E2E (Go suite: Kustomize + Helm)"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.0"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Setup e2e (Kind cluster, manifests)
        run: |
          make setup-test-e2e
          make manifests generate fmt vet

      - name: Run e2e tests (Manager + Helm chart)
        run: gotestsum --junitfile junit-e2e.xml -- -tags=e2e -v -ginkgo.v ./test/e2e/
        env:
          CERT_MANAGER_INSTALL_SKIP: "true"
          KIND_CLUSTER: "ephemeral-operator-test-e2e"

      - name: Publish E2E Test Results (PR comment)
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit-e2e.xml
          check_name: E2E Test Results
          comment_title: E2E Test Results
          comment_mode: always
          fail_on: test failures
          report_individual_runs: false

      - name: Cleanup Kind cluster
        if: always()
        run: make cleanup-test-e2e
