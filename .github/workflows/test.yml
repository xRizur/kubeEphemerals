# Disabled – unit tests run in ci.yml. Use workflow_dispatch to run manually if needed.
name: Tests

on:
  workflow_dispatch:
  # push:
  # pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
