# CD Pipeline: Zero-Click Release on push to main
# Calculates semver from Conventional Commits, builds changelog, runs GoReleaser (binary + Docker to GHCR).
# You can also run manually (Actions → Release → Run workflow) or as "Snapshot only" to test without publishing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release from (leave empty = default branch, or e.g. main, features/devops)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch != '' && github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Calculate next version
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: release_changelog_builder.json
          fromTag: ${{ steps.version.outputs.previous_tag }}
          toTag: ${{ steps.version.outputs.new_tag }}
          outputFile: ${{ runner.temp }}/release_notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag for GoReleaser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.new_tag }}" -m "Release ${{ steps.version.outputs.new_tag }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set lowercase repo env (GHCR requires lowercase)
        run: |
          echo "GITHUB_REPOSITORY_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "GITHUB_REPOSITORY_NAME_LOWER=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR (Docker push needs this)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.new_tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.0"

      - name: Package and push Helm chart (OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          CHART_VERSION="${TAG#v}"
          sed -i "s/^version: .*/version: ${CHART_VERSION}/" charts/ephemeral-operator/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${CHART_VERSION}\"/" charts/ephemeral-operator/Chart.yaml
          helm package charts/ephemeral-operator
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          helm push ephemeral-operator-${CHART_VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
