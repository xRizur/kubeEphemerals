# Gateway + platform.local listener (for dashboard behind OAuth).
# Apply: kubectl apply -f gateway.yaml

---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
  labels:
    app.kubernetes.io/name: envoy-gateway
    app.kubernetes.io/part-of: ephemeral-operator
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  description: "Envoy Gateway class for ephemeral environments"

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: default
  labels:
    app.kubernetes.io/name: main-gateway
    app.kubernetes.io/part-of: ephemeral-operator
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.preview.example.com"
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
    - name: platform
      protocol: HTTP
      port: 80
      hostname: "platform.local"
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io

---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
  labels:
    app.kubernetes.io/name: gateway-system
    app.kubernetes.io/part-of: ephemeral-operator
