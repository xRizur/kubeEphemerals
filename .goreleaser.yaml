# GoReleaser config: Go binary + Docker image to GHCR
# Used by .github/workflows/release.yml on push to main.
version: 2

project_name: ephemeral-operator

before:
  hooks:
    - go mod tidy

builds:
  - id: ephemeral-operator
    main: ./cmd
    binary: manager
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    format: tar.gz

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Changelog: workflow generates release_notes.md and passes via --release-header

dockers:
  - ids: [ephemeral-operator]
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER_LOWER }}/{{ .Env.GITHUB_REPOSITORY_NAME_LOWER }}:{{ .Tag }}"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER_LOWER }}/{{ .Env.GITHUB_REPOSITORY_NAME_LOWER }}:latest"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"

release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: "{{ .Env.GITHUB_REPOSITORY_NAME }}"
  draft: false
  mode: replace
  # Release body is set via --release-header=release_notes.md in the workflow
