---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: environmenttemplates.ephemeral.ephemeralenv.io
spec:
  group: ephemeral.ephemeralenv.io
  names:
    kind: EnvironmentTemplate
    listKind: EnvironmentTemplateList
    plural: environmenttemplates
    shortNames:
    - etpl
    singular: environmenttemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.components | length
      name: Components
      type: integer
    - jsonPath: .spec.defaultTTL
      name: Default TTL
      type: string
    - jsonPath: .status.usageCount
      name: Usage
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EnvironmentTemplate is the Schema for the environmenttemplates API.
          It defines reusable configurations for creating ephemeral environments.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EnvironmentTemplateSpec defines the desired state of EnvironmentTemplate.
              Templates provide reusable configurations for ephemeral environments,
              allowing users to create environments from pre-configured setups.
            properties:
              components:
                description: |-
                  Components lists the Helm charts that will be deployed.
                  At least one component is required.
                items:
                  description: |-
                    ComponentSpec defines a single component (Helm chart) within a template.
                    Each component represents one Helm chart to be deployed.
                  properties:
                    chart:
                      description: Chart is the name of the Helm chart
                      minLength: 1
                      type: string
                    name:
                      description: Name is a human-readable name for this component
                      minLength: 1
                      type: string
                    primary:
                      default: false
                      description: |-
                        Primary indicates if this is the main component (used for routing).
                        Exactly one component must be marked as primary.
                      type: boolean
                    repository:
                      description: Repository is the Helm chart repository URL
                      pattern: ^https?://.*
                      type: string
                    serviceName:
                      description: ServiceName is the name of the Kubernetes service
                        created by this chart
                      minLength: 1
                      type: string
                    servicePort:
                      description: ServicePort is the port exposed by the service
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    values:
                      description: Values contains default Helm values for this component
                      x-kubernetes-preserve-unknown-fields: true
                    version:
                      description: Version is the chart version to deploy
                      pattern: ^[0-9]+\.[0-9]+\.[0-9]+.*$
                      type: string
                  required:
                  - chart
                  - name
                  - repository
                  - serviceName
                  - servicePort
                  - version
                  type: object
                minItems: 1
                type: array
              defaultGateway:
                description: DefaultGateway provides default gateway configuration
                properties:
                  name:
                    description: Name is the default gateway name
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the default gateway namespace
                    minLength: 1
                    type: string
                type: object
              defaultTTL:
                default: 1h
                description: DefaultTTL is the default time-to-live for environments
                  created from this template
                pattern: ^([0-9]+h)?([0-9]+m)?([0-9]+s)?$
                type: string
              description:
                description: Description provides details about what this template
                  deploys
                maxLength: 500
                type: string
              displayName:
                description: DisplayName is the human-readable name shown in the UI
                maxLength: 100
                minLength: 1
                type: string
              icon:
                description: Icon is an emoji or icon identifier for the UI
                maxLength: 10
                type: string
              tags:
                description: Tags are labels for filtering/categorization
                items:
                  type: string
                type: array
            required:
            - components
            - displayName
            type: object
          status:
            description: EnvironmentTemplateStatus defines the observed state of EnvironmentTemplate
