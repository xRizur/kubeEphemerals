---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: ephemeralenvs.ephemeral.ephemeralenv.io
spec:
  group: ephemeral.ephemeralenv.io
  names:
    kind: EphemeralEnv
    listKind: EphemeralEnvList
    plural: ephemeralenvs
    shortNames:
    - eenv
    singular: ephemeralenv
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.accessURL
      name: URL
      type: string
    - jsonPath: .status.activeNamespace
      name: Namespace
      type: string
    - jsonPath: .status.expirationTime
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EphemeralEnv is the Schema for the ephemeralenvs API.
          It manages short-lived environments for Pull Requests, providing
          automatic namespace creation, Helm chart deployment, network isolation,
          and Gateway API routing.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EphemeralEnvSpec defines the desired state of EphemeralEnv
            properties:
              components:
                description: |-
                  Components lists multiple Helm charts to deploy in this environment.
                  Each component is deployed as a separate Helm release.
                  At least one component must be marked as Primary for routing.
                items:
                  description: |-
                    DeployedComponentSpec defines a component to be deployed as part of the environment.
                    This is similar to ComponentSpec from EnvironmentTemplate but with additional runtime fields.
                  properties:
                    chart:
                      description: Chart is the name of the Helm chart
                      minLength: 1
                      type: string
                    name:
                      description: Name is a human-readable name for this component
                      minLength: 1
                      type: string
                    primary:
                      default: false
                      description: |-
                        Primary indicates if this is the main component (used for routing).
                        Exactly one component must be marked as primary.
                      type: boolean
                    repository:
                      description: Repository is the Helm chart repository URL
                      pattern: ^https?://.*
                      type: string
                    serviceName:
                      description: ServiceName is the name of the Kubernetes service
                        created by this chart
                      minLength: 1
                      type: string
                    servicePort:
                      description: ServicePort is the port exposed by the service
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    values:
                      description: Values contains Helm values to override chart defaults.
                      x-kubernetes-preserve-unknown-fields: true
                    version:
                      description: Version is the chart version to deploy
                      pattern: ^[0-9]+\.[0-9]+\.[0-9]+.*$
                      type: string
                  required:
                  - chart
                  - name
                  - repository
                  - serviceName
                  - servicePort
                  - version
                  type: object
                type: array
              gateway:
                description: Gateway configures the Gateway API HTTPRoute for external
                  access
                properties:
                  domainPrefix:
                    description: |-
                      DomainPrefix is the subdomain prefix for the HTTPRoute.
                      The full URL will be: https://{domainPrefix}.{gateway-domain}
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
                  name:
                    description: Name is the name of the parent Gateway resource
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the namespace where the Gateway resides
                    minLength: 1
                    type: string
                  serviceName:
                    description: ServiceName is the name of the backend service to
                      route traffic to
                    minLength: 1
                    type: string
                  targetPort:
                    default: 80
                    description: TargetPort is the port of the backend service
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - domainPrefix
                - name
                - namespace
                - serviceName
                type: object
              helm:
                description: |-
                  Helm contains the Helm chart deployment configuration for single-chart deployments.
                  DEPRECATED: Use Components for new deployments. This field is kept for backward compatibility.
                  When both Helm and Components are specified, Components takes precedence.
                properties:
                  chart:
                    description: Chart is the name of the Helm chart
                    minLength: 1
                    type: string
                  repository:
                    description: Repository is the Helm chart repository URL
                    pattern: ^https?://.*
                    type: string
                  values:
                    description: |-
                      Values contains Helm values to override chart defaults.
                      Supports any YAML structure including nested objects, arrays, integers, etc.
                      These are passed to Helm during install/upgrade.
                    x-kubernetes-preserve-unknown-fields: true
                  version:
                    description: Version is the specific version of the Helm chart
                      to deploy
                    pattern: ^[0-9]+\.[0-9]+\.[0-9]+.*$
                    type: string
                required:
                - chart
                - repository
                - version
                type: object
              isolation:
                default: true
                description: |-
                  Isolation enables NetworkPolicy to isolate the environment.
                  When true, a deny-all NetworkPolicy is created in the namespace.
                type: boolean
              templateRef:
                description: |-
                  TemplateRef references an EnvironmentTemplate to use as the base configuration.
                  When specified, the template's components will be used.
                properties:
                  name:
                    description: Name is the name of the EnvironmentTemplate
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace where the template resides.
                      If empty, uses the same namespace as the EphemeralEnv.
                    type: string
                required:
                - name
                type: object
              ttl:
                default: 24h
                description: |-
                  TTL is the time-to-live duration for the ephemeral environment.
                  After this duration, the environment will be automatically deleted.
                  Format: Go duration string (e.g., "2h", "30m", "24h")
                pattern: ^([0-9]+h)?([0-9]+m)?([0-9]+s)?$
                type: string
            required:
            - gateway
            type: object
          status:
            description: EphemeralEnvStatus defines the observed state of EphemeralEnv
            properties:
              accessURL:
                description: AccessURL is the full URL to access the deployed application
                type: string
              activeNamespace:
                description: |-
                  ActiveNamespace is the name of the created namespace for this environment.
                  Format: env-{cr-name}
                type: string
              adminURL:
                description: AdminURL is the URL to access the admin dashboard for
                  this environment
                type: string
              componentStatuses:
                description: ComponentStatuses tracks the status of each deployed
                  component
                items:
                  description: ComponentStatus tracks the deployment status of a single
                    component
                  properties:
                    lastDeployed:
                      description: LastDeployed is when the component was last deployed
                      format: date-time
                      type: string
                    message:
                      description: Message contains any status message for this component
                      type: string
                    name:
                      description: Name is the component name (matching DeployedComponentSpec.Name)
                      type: string
                    releaseName:
                      description: ReleaseName is the Helm release name for this component
                      type: string
                    status:
                      description: Status is the deployment status of this component
                      type: string
                  required:
                  - name
                  type: object
                type: array
              conditions:
                description: |-
                  Conditions represent the latest available observations of the resource's state.
                  Standard condition types:
                  - NamespaceReady: The namespace has been created
                  - NetworkPolicyApplied: The NetworkPolicy has been applied (if isolation=true)
                  - HelmDeployed: The Helm chart has been deployed successfully
                  - HTTPRouteReady: The HTTPRoute has been created and accepted
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expirationTime:
                description: ExpirationTime is the timestamp when the environment
                  will be deleted
                format: date-time
                type: string
              helmRelease:
                description: |-
                  HelmRelease contains the name of the Helm release (for single-chart deployments)
                  DEPRECATED: Use ComponentStatuses for multi-chart deployments
                type: string
              lastReconcileTime:
                description: LastReconcileTime is the timestamp of the last successful
                  reconciliation
                format: date-time
                type: string
              message:
                description: Message provides human-readable status information
                type: string
              phase:
                description: Phase represents the current lifecycle phase of the EphemeralEnv
                enum:
                - Pending
                - Active
                - Failed
                - Expired
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
