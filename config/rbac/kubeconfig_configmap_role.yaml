# Role and RoleBinding so the manager can read the optional ConfigMap
# ephemeral-operator-ui-config (key kubeconfig-server-url) in the operator namespace.
# That ConfigMap overrides the API server URL in generated kubeconfigs (per-cluster config,
# see ARCHITECTURE.md Appendix D). When using config/default, namespace and namePrefix
# are applied; create the ConfigMap in the same namespace with the same name.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeconfig-configmap-reader
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["ephemeral-operator-ui-config"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeconfig-configmap-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeconfig-configmap-reader
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
