# This rule is not used by the project ephemeral-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ephemeral.ephemeralenv.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ephemeral-operator
    app.kubernetes.io/managed-by: kustomize
  name: ephemeralenv-viewer-role
rules:
- apiGroups:
  - ephemeral.ephemeralenv.io
  resources:
  - ephemeralenvs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ephemeral.ephemeralenv.io
  resources:
  - ephemeralenvs/status
  verbs:
  - get
