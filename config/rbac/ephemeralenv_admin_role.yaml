# This rule is not used by the project ephemeral-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over ephemeral.ephemeralenv.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ephemeral-operator
    app.kubernetes.io/managed-by: kustomize
  name: ephemeralenv-admin-role
rules:
- apiGroups:
  - ephemeral.ephemeralenv.io
  resources:
  - ephemeralenvs
  verbs:
  - '*'
- apiGroups:
  - ephemeral.ephemeralenv.io
  resources:
  - ephemeralenvs/status
  verbs:
  - get
