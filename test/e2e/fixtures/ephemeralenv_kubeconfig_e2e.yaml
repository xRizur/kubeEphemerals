# Minimal EphemeralEnv for e2e kubeconfig self-service test.
# Controller creates namespace + developer-access RBAC; HTTPRoute may fail (no gateway).
apiVersion: ephemeral.ephemeralenv.io/v1alpha1
kind: EphemeralEnv
metadata:
  name: e2e-kubeconfig
  namespace: default
spec:
  ttl: "1h"
  isolation: true
  gateway:
    name: main-gateway
    namespace: default
    domainPrefix: e2e-kubeconfig
    serviceName: placeholder
    targetPort: 80
